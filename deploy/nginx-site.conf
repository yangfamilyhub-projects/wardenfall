# Wardenfall static site, before certbot. certbot --nginx --redirect adds the 443 listener and HTTP->HTTPS redirect.
# Replace HOST and ROOT, e.g. with: sed -e 's|HOST|wf2.zizzy.name|' -e 's|ROOT|/var/www/wardenfall-slots/wf2|'
# Test slots keep the X-Robots-Tag lines; production drops them.
server {
    listen 80;
    server_name HOST;

    root ROOT;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # The web root is a git checkout: never serve repo metadata, ops files or the relay's source
    location ~ ^/(\.git|deploy|docs|server)(/|$) { deny all; }

    # Multiplayer relay (server/relay.js, systemd unit wardenfall-relay)
    location = /mp {
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
